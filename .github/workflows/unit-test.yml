name: Unit Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Other models keep their existing source pin. K3's additive runtime hooks
    # use the exact companion revision until it is merged upstream. Do not move
    # unrelated model mirror digests just to admit the new K3 framework.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: existing-models
            sglang_repository: sgl-project/sglang
            sglang_commit: aa3e34aaebf880d72482cea74dbbfef54da728e2
            pytest_selection: "not kimi and not the_binding_tolerates_exactly_the_pinned_sglang_code and not every_binding_callable_the_plugin_reads_is_tolerated"
          - suite: kimi-tp8
            sglang_repository: LeslieWylie/sglang
            sglang_commit: 243089ecf2b85fe1f6f69d87b73cc20000997380
            pytest_selection: "kimi or the_binding_tolerates_exactly_the_pinned_sglang_code or every_binding_callable_the_plugin_reads_is_tolerated"
    name: Unit Test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the pinned SGLang source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.sglang_repository }}
          ref: ${{ matrix.sglang_commit }}
          path: .ci/sglang
          persist-credentials: false

      # CPU unit tests do not use SGLang's optional Rust extensions. Install
      # torch before building so build isolation does not download it twice.
      # CUDA Python dependencies still come from SGLang's own package metadata.
      - name: Install SGLang and the package
        env:
          SGLANG_BUILD_RUST_EXTS: none
        run: |
          python -m pip install uv
          uv pip install --system torch==2.14.1 setuptools setuptools-rust setuptools-scm wheel pytest
          uv pip install --system --no-build-isolation --prerelease allow ./.ci/sglang/python
          uv pip install --system --no-deps -e .

      - name: Run unit tests
        env:
          PYTEST_SELECTION: ${{ matrix.pytest_selection }}
        run: python -m pytest test/unit -v -rfE -k "$PYTEST_SELECTION"
